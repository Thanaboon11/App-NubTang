<html lang="th">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f7f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>นับตัง - บันทึกรายรับรายจ่าย</title>

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    :root {
      --bg: #f7f5f2;
      --card: #ffffff;
      --accent: #2c2825;
      --accent-soft: #efece6;
      --income: #3d7a68;
      --income-bg: #eef5f2;
      --expense: #c25949;
      --expense-bg: #fbf0ee;
      --text: #2c2825;
      --muted: #8c857e;
      --border: #ebe6df;
    }
    * { box-sizing: border-box; font-family: 'Prompt', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #edeae4; color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-shell { width: 100%; max-width: 480px; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 86px; }

    .page { display: none; animation: fadeIn 0.22s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .top-bar { padding: 26px 22px 12px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 16px; font-weight: 600; color: var(--text); }
    .sheet-shortcut {
      background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 13px;
      border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }

    .content { padding: 8px 20px 20px; }
    .balance-card {
      background: var(--card); border-radius: 24px; padding: 24px 22px;
      border: 1px solid var(--border); margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(44, 40, 37, 0.03);
    }
    .balance-title { font-size: 13px; color: var(--muted); }
    .balance-val { font-size: 36px; font-weight: 600; color: var(--text); letter-spacing: -0.8px; margin: 4px 0 18px; }
    .summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--border); padding-top: 14px; }
    .sum-box { background: var(--bg); padding: 10px 14px; border-radius: 14px; }
    .sum-label { font-size: 11px; color: var(--muted); }
    .sum-num { font-size: 15px; font-weight: 600; margin-top: 2px; }

    .card {
      background: var(--card); border-radius: 24px; padding: 20px;
      border: 1px solid var(--border); margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(44, 40, 37, 0.03);
    }
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 5px; border-radius: 14px; margin-bottom: 18px; }
    .type-btn { padding: 10px; border: none; border-radius: 10px; background: transparent; font-weight: 500; font-size: 14px; color: var(--muted); cursor: pointer; }
    .type-btn.active.expense { background: var(--card); color: var(--expense); font-weight: 600; box-shadow: 0 2px 6px rgba(44,40,37,0.05); }
    .type-btn.active.income { background: var(--card); color: var(--income); font-weight: 600; box-shadow: 0 2px 6px rgba(44,40,37,0.05); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
      font-size: 15px; outline: none; background: var(--bg); color: var(--text);
    }
    input:focus, select:focus { border-color: var(--accent); background: var(--card); }

    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: var(--accent); color: #ffffff;
      font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 4px;
    }
    .btn-primary:disabled { opacity: 0.5; }
    .btn-outline {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--bg); color: var(--text); font-size: 14px; font-weight: 500;
      cursor: pointer; text-align: center; display: block; text-decoration: none;
    }

    .page-header { padding: 26px 22px 10px; display: flex; justify-content: space-between; align-items: center; }
    .page-title { font-size: 20px; font-weight: 600; color: var(--text); margin: 0; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .pill { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); font-size: 12px; color: var(--muted); cursor: pointer; font-weight: 500; }
    .pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    .tx-item {
      background: var(--card); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px;
      border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .tx-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tx-badge {
      width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-weight: 600; font-size: 15px; flex-shrink: 0;
    }
    .tx-badge.income { background: var(--income-bg); color: var(--income); }
    .tx-badge.expense { background: var(--expense-bg); color: var(--expense); }
    .tx-meta { min-width: 0; }
    .tx-title { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
