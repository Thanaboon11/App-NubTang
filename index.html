<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="นับตัง">
  <title>นับตัง - บันทึกรายรับรายจ่าย</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #1e1b4b;
      --primary-soft: #eef2ff;
      --income: #059669;
      --income-bg: #d1fae5;
      --expense: #e11d48;
      --expense-bg: #ffe4e6;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Prompt', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #e2e8f0; color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-shell { width: 100%; max-width: 480px; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 84px; box-shadow: 0 0 30px rgba(0,0,0,0.08); }

    /* Page Switching */
    .page { display: none; animation: fadeIn 0.2s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Top Card Header */
    .hero {
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 60%, #4f46e5 100%);
      color: white; padding: 28px 22px 32px; border-radius: 0 0 28px 28px;
      box-shadow: 0 10px 25px -5px rgba(30, 27, 75, 0.3);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .sheet-shortcut {
      background: rgba(255,255,255,0.15); color: white; border: none; padding: 6px 12px;
      border-radius: 20px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .balance-title { font-size: 13px; opacity: 0.8; }
    .balance-val { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0 16px; }
    .summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sum-box { background: rgba(255,255,255,0.1); padding: 10px 12px; border-radius: 14px; backdrop-filter: blur(6px); }
    .sum-label { font-size: 11px; opacity: 0.85; }
    .sum-num { font-size: 15px; font-weight: 600; margin-top: 2px; }

    /* Container & Card */
    .content { padding: 18px; }
    .page-header { padding: 24px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
    .page-title { font-size: 20px; font-weight: 700; color: var(--primary-dark); margin: 0; }
    .card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04); border: 1px solid var(--border); margin-bottom: 16px; }

    /* Toggle & Form */
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #f1f5f9; padding: 5px; border-radius: 14px; margin-bottom: 16px; }
    .type-btn { padding: 10px; border: none; border-radius: 10px; background: transparent; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; transition: 0.2s; }
    .type-btn.active.expense { background: white; color: var(--expense); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .type-btn.active.income { background: white; color: var(--income); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 15px; outline: none; background: #f8fafc; color: var(--text); transition: 0.2s;
    }
    input:focus { border-color: var(--primary); background: white; }

    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #3730a3); color: white;
      font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
    }
    .btn-primary:disabled { opacity: 0.6; }
    .btn-outline {
      width: 100%; padding: 12px; border: 1.5px solid var(--primary); border-radius: 12px;
      background: var(--primary-soft); color: var(--primary); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; display: block; text-decoration: none;
    }

    /* Filter Pills */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .pill { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: white; font-size: 13px; color: var(--muted); cursor: pointer; font-weight: 500; }
    .pill.active { background: var(--primary-dark); color: white; border-color: var(--primary-dark); }

    /* Transaction Item */
    .tx-item {
      background: white; border-radius: 16px; padding: 14px; margin-bottom: 10px;
      border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .tx-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tx-badge {
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .tx-badge.income { background: var(--income-bg); color: var(--income); }
    .tx-badge.expense { background: var(--expense-bg); color: var(--expense); }
    .tx-meta { min-width: 0; }
    .tx-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tx-right { text-align: right; flex-shrink: 0; margin-left: 8px; }
    .tx-amt { font-weight: 700; font-size: 15px; }
    .tx-amt.income { color: var(--income); }
    .tx-amt.expense { color: var(--expense); }
    .tx-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
    .act-btn {
      border: none; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 500; cursor: pointer;
    }
    .act-edit { background: #f1f5f9; color: #334155; }
    .act-del { background: #ffe4e6; color: #e11d48; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; max-width: 480px; background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 0 12px; z-index: 50;
    }
    .nav-btn {
      background: none; border: none; display: flex; flex-direction: column; align-items: center;
      gap: 3px; color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer;
    }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
    .nav-icon { font-size: 20px; }

    /* Modal for Edit */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: none;
      align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: white; width: 100%; max-width: 400px; border-radius: 22px; padding: 22px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .btn-cancel { padding: 12px; border: 1px solid var(--border); background: #f8fafc; border-radius: 12px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- ==================== หน้า 1: บันทึกรายการ ==================== -->
  <div id="pageRecord" class="page active">
    <div class="hero">
      <div class="hero-top">
        <div class="brand">🐷 นับตัง</div>
        <a id="topSheetLink" href="#" target="_blank" class="sheet-shortcut">📊 เปิดชีต</a>
      </div>
      <div class="balance-title">ยอดเงินคงเหลือสุทธิ</div>
      <div class="balance-val" id="totalBalance">฿0.00</div>
      <div class="summary-row">
        <div class="sum-box">
          <div class="sum-label">รายรับรวม</div>
          <div class="sum-num" id="totalIncome" style="color:#6ee7b7;">+฿0.00</div>
        </div>
        <div class="sum-box">
          <div class="sum-label">รายจ่ายรวม</div>
          <div class="sum-num" id="totalExpense" style="color:#fda4af;">-฿0.00</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="type-toggle">
          <button type="button" class="type-btn active expense" id="btnExpense" onclick="setType('รายจ่าย')">- รายจ่าย</button>
          <button type="button" class="type-btn income" id="btnIncome" onclick="setType('รายรับ')">+ รายรับ</button>
        </div>
        <form id="txForm">
          <div class="form-group">
            <label>วันที่</label>
            <input type="date" id="dateInput" required>
          </div>
          <div class="form-group">
            <label>รายการ</label>
            <input type="text" id="itemInput" placeholder="เช่น ค่าอาหาร, ค่ารถ, เงินเดือน" required>
          </div>
          <div class="form-group">
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="amountInput" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" required>
          </div>
          <button type="submit" class="btn-primary" id="submitBtn">บันทึกรายการ</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== หน้า 2: ประวัติรายการ ==================== -->
  <div id="pageHistory" class="page">
    <div class="page-header">
      <h2 class="page-title">ประวัติรายการ</h2>
      <button onclick="loadData()" style="border:none; background:var(--primary-soft); color:var(--primary); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;">↻ รีเฟรช</button>
    </div>
    <div class="content" style="padding-top:8px;">
      <div class="form-group">
        <input type="text" id="searchInput" placeholder="🔍 ค้นหาชื่อรายการ..." oninput="renderHistory()">
      </div>
      <div class="filter-bar">
        <button class="pill active" onclick="setFilter('all', this)">ทั้งหมด</button>
        <button class="pill" onclick="setFilter('รายรับ', this)">รายรับ</button>
        <button class="pill" onclick="setFilter('รายจ่าย', this)">รายจ่าย</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- ==================== หน้า 3: ตั้งค่า ==================== -->
  <div id="pageSettings" class="page">
    <div class="page-header">
      <h2 class="page-title">ตั้งค่าการเชื่อมต่อ</h2>
    </div>
    <div class="content" style="padding-top:8px;">
      <div class="card">
        <div class="form-group">
          <label>ลิงก์ไฟล์ Google Sheets (สำหรับกดเปิดดูตาราง)</label>
          <input type="url" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/...">
        </div>
        <div class="form-group">
          <label>ลิงก์ Apps Script Web App URL (สำหรับส่งข้อมูล)</label>
          <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <button type="button" class="btn-primary" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      </div>

      <div class="card">
        <label style="margin-bottom:8px;">ทางลัดเข้าถึงข้อมูล</label>
        <a id="settingsOpenSheetBtn" href="#" target="_blank" class="btn-outline">เปิดไฟล์ Google Sheets ↗</a>
      </div>
    </div>
  </div>

  <!-- แถบเมนูด้านล่าง 3 หน้า -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navRecord" onclick="switchPage('Record')">
      <span class="nav-icon">✍️</span>
      <span>บันทึก</span>
    </button>
    <button class="nav-btn" id="navHistory" onclick="switchPage('History')">
      <span class="nav-icon">📋</span>
      <span>ประวัติ</span>
    </button>
    <button class="nav-btn" id="navSettings" onclick="switchPage('Settings')">
      <span class="nav-icon">⚙️</span>
      <span>ตั้งค่า</span>
    </button>
  </nav>

</div>

<!-- หน้าต่างแก้ไขรายการ (Edit Modal) -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box">
    <h3 style="margin:0 0 14px; font-size:18px;">แก้ไขรายการ</h3>
    <input type="hidden" id="editRowIndex">
    <div class="form-group">
      <label>ประเภท</label>
      <select id="editType">
        <option value="รายจ่าย">รายจ่าย</option>
        <option value="รายรับ">รายรับ</option>
      </select>
    </div>
    <div class="form-group">
      <label>วันที่</label>
      <input type="date" id="editDate" required>
    </div>
    <div class="form-group">
      <label>รายการ</label>
      <input type="text" id="editItem" required>
    </div>
    <div class="form-group">
      <label>จำนวนเงิน (บาท)</label>
      <input type="number" id="editAmount" step="0.01" min="0.01" required>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeEditModal()">ยกเลิก</button>
      <button type="button" class="btn-primary" id="saveEditBtn" onclick="submitEdit()">บันทึกการแก้ไข</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycby2EpjVYWplVN_OWZtjMLapbgc53eQi5VIxjKesXbJfn0JtjA6PCfTbQ-aU8WwNxSsZjQ/exec';
  const DEFAULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1rrhwKB9QoYmjJS1tmBJMkijUp0rhRNvI6VfDTRd9X4c/edit';

  let currentType = 'รายจ่าย';
  let currentFilter = 'all';
  let allRecords = [];

  document.getElementById('dateInput').valueAsDate = new Date();

  function getApiUrl() {
    return localStorage.getItem('nubtang_api_url') || DEFAULT_API_URL;
  }
  function getSheetUrl() {
    return localStorage.getItem('nubtang_sheet_url') || DEFAULT_SHEET_URL;
  }

  function initSettings() {
    const sheetUrl = getSheetUrl();
    const apiUrl = getApiUrl();
    document.getElementById('sheetUrlInput').value = sheetUrl;
    document.getElementById('apiUrlInput').value = apiUrl;
    document.getElementById('topSheetLink').href = sheetUrl;
    document.getElementById('settingsOpenSheetBtn').href = sheetUrl;
  }

  function saveSettings() {
    const sheetUrl = document.getElementById('sheetUrlInput').value.trim();
    const apiUrl = document.getElementById('apiUrlInput').value.trim();
    if (sheetUrl) localStorage.setItem('nubtang_sheet_url', sheetUrl);
    if (apiUrl) localStorage.setItem('nubtang_api_url', apiUrl);
    initSettings();
    alert('บันทึกการตั้งค่าเรียบร้อยแล้ว');
    loadData();
  }

  function switchPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page' + pageName).classList.add('active');
    document.getElementById('nav' + pageName).classList.add('active');
    if (pageName === 'History') renderHistory();
  }

  function setType(type) {
    currentType = type;
    document.getElementById('btnExpense').classList.toggle('active', type === 'รายจ่าย');
    document.getElementById('btnIncome').classList.toggle('active', type === 'รายรับ');
  }

  function setFilter(filter, btnEl) {
    currentFilter = filter;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btnEl.classList.add('active');
    renderHistory();
  }

  function formatMoney(num) {
    return '฿' + Number(num).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function loadData() {
    const listEl = document.getElementById('historyList');
    listEl.innerHTML = '<div style="text-align:center; color:#64748b; padding:30px 0;">กำลังโหลดข้อมูล...</div>';
    try {
      const res = await fetch(getApiUrl(), { redirect: 'follow' });
      const data = await res.json();
      
      allRecords = (data.records || []).filter(r => String(r.item).trim() !== '' && Number(r.amount) > 0);
      
      let sumInc = 0, sumExp = 0;
      allRecords.forEach(r => {
        if (r.type === 'รายรับ') sumInc += Number(r.amount);
        else sumExp += Number(r.amount);
      });

      const currentBalance = allRecords.length > 0 ? allRecords[0].balance : (sumInc - sumExp);
      document.getElementById('totalBalance').textContent = formatMoney(currentBalance);
      document.getElementById('totalIncome').textContent = '+' + formatMoney(sumInc);
      document.getElementById('totalExpense').textContent = '-' + formatMoney(sumExp);

      renderHistory();
    } catch (err) {
      listEl.innerHTML = '<div style="text-align:center; color:#e11d48; padding:30px 0;">โหลดข้อมูลไม่สำเร็จ ตรวจสอบลิงก์ในหน้าตั้งค่า</div>';
    }
  }

  function renderHistory() {
    const listEl = document.getElementById('historyList');
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = allRecords.filter(r => {
      const matchType = currentFilter === 'all' || r.type === currentFilter;
      const matchText = String(r.item).toLowerCase().includes(keyword);
      return matchType && matchText;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:#64748b; padding:30px 0;">ไม่พบรายการบันทึก</div>';
      return;
    }

    listEl.innerHTML = filtered.map(r => {
      const isInc = r.type === 'รายรับ';
      const safeItem = String(r.item).replace(/'/g, "\\'");
      return `
        <div class="tx-item">
          <div class="tx-left">
            <div class="tx-badge ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}</div>
            <div class="tx-meta">
              <div class="tx-title">${r.item}</div>
              <div class="tx-sub">${r.date} • คงเหลือ ${formatMoney(r.balance)}</div>
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amt ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}${formatMoney(r.amount)}</div>
            <div class="tx-actions">
              <button class="act-btn act-edit" onclick="openEditModal(${r.rowIndex}, '${r.date}', '${r.type}', '${safeItem}', ${r.amount})">แก้ไข</button>
              <button class="act-btn act-del" onclick="deleteRecord(${r.rowIndex}, '${safeItem}')">ลบ</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // เพิ่มรายการใหม่
  document.getElementById('txForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';

    const payload = {
      action: 'add',
      date: document.getElementById('dateInput').value,
      type: currentType,
      item: document.getElementById('itemInput').value.trim(),
      amount: parseFloat(document.getElementById('amountInput').value)
    };

    try {
      await fetch(getApiUrl(), {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      document.getElementById('itemInput').value = '';
      document.getElementById('amountInput').value = '';
      setTimeout(() => {
        loadData();
        switchPage('History'); // บันทึกเสร็จพาไปดูในหน้าประวัติทันที
      }, 1200);
    } catch (err) {
      alert('เกิดข้อผิดพลาดในการบันทึก');
    } finally {
      btn.disabled = false;
      btn.textContent = 'บันทึกรายการ';
    }
  });

  // แก้ไขรายการ
  function openEditModal(rowIndex, date, type, item, amount) {
    if (!rowIndex) return alert('กรุณาอัปเดต Apps Script เป็นเวอร์ชันใหม่ก่อนใช้งานฟังก์ชันแก้ไข');
    document.getElementById('editRowIndex').value = rowIndex;
    document.getElementById('editDate').value = date;
    document.getElementById('editType').value = type;
    document.getElementById('editItem').value = item;
    document.getElementById('editAmount').value = amount;
    document.getElementById('editModal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
  }

  async function submitEdit() {
    const btn = document.getElementById('saveEditBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังอัปเดต...';

    const payload = {
      action: 'edit',
      rowIndex: Number(document.getElementById('editRowIndex').value),
      date: document.getElementById('editDate').value,
      type: document.getElementById('editType').value,
      item: document.getElementById('editItem').value.trim(),
      amount: parseFloat(document.getElementById('editAmount').value)
    };

    try {
      await fetch(getApiUrl(), {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      closeEditModal();
      setTimeout(loadData, 1200);
    } catch (err) {
      alert('แก้ไขไม่สำเร็จ');
    } finally {
      btn.disabled = false;
      btn.textContent = 'บันทึกการแก้ไข';
    }
  }

  // ลบรายการ
  async function deleteRecord(rowIndex, itemName) {
    if (!rowIndex) return alert('กรุณาอัปเดต Apps Script เป็นเวอร์ชันใหม่ก่อนใช้งานฟังก์ชันลบ');
    if (!confirm(`ต้องการลบรายการ "${itemName}" ใช่หรือไม่?`)) return;

    try {
      await fetch(getApiUrl(), {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', rowIndex: Number(rowIndex) })
      });
      setTimeout(loadData, 1200);
    } catch (err) {
      alert('ลบรายการไม่สำเร็จ');
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  initSettings();
  loadData();
</script>
</body>
</html>
