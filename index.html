<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d6e43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="นับตัง">
  <title>นับตัง - บันทึกรายรับรายจ่าย</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #108a54;
      --primary-light: #e6f6ee;
      --danger: #e11d48;
      --danger-light: #ffe4e6;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Prompt', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .app-shell { width: 100%; max-width: 480px; background: var(--bg); padding-bottom: 40px; }
    
    /* Header */
    .header {
      background: linear-gradient(145deg, #0b6b3a 0%, #159957 100%);
      color: white;
      padding: 32px 24px 48px;
      border-radius: 0 0 32px 32px;
      box-shadow: 0 10px 25px -5px rgba(11, 107, 58, 0.25);
    }
    .app-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.16); padding: 4px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 500; margin-bottom: 12px; backdrop-filter: blur(4px);
    }
    .balance-label { font-size: 13px; opacity: 0.85; font-weight: 400; }
    .balance { font-size: 38px; font-weight: 700; letter-spacing: -0.5px; margin-top: 2px; }

    /* Container & Cards */
    .container { padding: 0 18px; margin-top: -28px; }
    .card {
      background: var(--card); border-radius: 22px; padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.8);
    }

    /* Toggle Buttons */
    .type-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f1f5f9; padding: 5px; border-radius: 14px; margin-bottom: 16px;
    }
    .type-btn {
      padding: 10px; border: none; border-radius: 10px; background: transparent;
      font-weight: 600; font-size: 14px; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
    }
    .type-btn.active.expense { background: white; color: var(--danger); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .type-btn.active.income { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    /* Inputs */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 15px; outline: none; background: #f8fafc; color: var(--text-main); transition: 0.2s;
    }
    input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(16, 138, 84, 0.1); }
    
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #108a54, #0b6b3a); color: white;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
      box-shadow: 0 4px 12px rgba(16, 138, 84, 0.25); transition: transform 0.1s;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Transaction List */
    .list-header { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .refresh-btn {
      font-size: 12px; color: var(--primary); background: var(--primary-light);
      padding: 5px 12px; border-radius: 20px; font-weight: 600; cursor: pointer;
    }
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #f1f5f9;
    }
    .tx-item:last-child { border-bottom: none; padding-bottom: 4px; }
    .tx-left { display: flex; align-items: center; gap: 12px; }
    .tx-icon {
      width: 40px; height: 40px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .tx-icon.income { background: var(--primary-light); color: var(--primary); }
    .tx-icon.expense { background: var(--danger-light); color: var(--danger); }
    .tx-info { display: flex; flex-direction: column; }
    .tx-name { font-weight: 500; font-size: 15px; color: var(--text-main); }
    .tx-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .tx-right { text-align: right; }
    .tx-amount { font-weight: 600; font-size: 15px; }
    .tx-amount.income { color: var(--primary); }
    .tx-amount.expense { color: var(--danger); }
    .tx-bal { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 28px 0; font-size: 14px; }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="header">
      <div class="app-badge">🐷 นับตัง</div>
      <div class="balance-label">ยอดเงินคงเหลือปัจจุบัน</div>
      <div class="balance" id="totalBalance">฿0.00</div>
    </div>

    <div class="container">
      <div class="card">
        <div class="type-toggle">
          <button type="button" class="type-btn active expense" id="btnExpense" onclick="setType('รายจ่าย')">รายจ่าย</button>
          <button type="button" class="type-btn income" id="btnIncome" onclick="setType('รายรับ')">รายรับ</button>
        </div>
        <form id="txForm">
          <div class="form-group">
            <label>วันที่ทำรายการ</label>
            <input type="date" id="dateInput" required>
          </div>
          <div class="form-group">
            <label>ชื่อรายการ</label>
            <input type="text" id="itemInput" placeholder="เช่น ค่าอาหาร, ค่ารถ, เงินเดือน" required>
          </div>
          <div class="form-group">
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="amountInput" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" required>
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">บันทึกรายการ</button>
        </form>
      </div>

      <div class="card">
        <div class="list-header">
          <span>ประวัติรายการล่าสุด</span>
          <span class="refresh-btn" onclick="loadData()">↻ รีเฟรช</span>
        </div>
        <div id="txList"><div class="empty-state">กำลังโหลดข้อมูล...</div></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwmvvZqrTGEwkWRSJGIam02XLZR0xksJYn4lgz3NAtREDHb7Eu1tIuMy0ULAGdkQSo5Hg/exec';

    let currentType = 'รายจ่าย';
    document.getElementById('dateInput').valueAsDate = new Date();

    function setType(type) {
      currentType = type;
      document.getElementById('btnExpense').classList.toggle('active', type === 'รายจ่าย');
      document.getElementById('btnIncome').classList.toggle('active', type === 'รายรับ');
    }

    function formatMoney(num) {
      return '฿' + Number(num).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function loadData() {
      const listEl = document.getElementById('txList');
      listEl.innerHTML = '<div class="empty-state">กำลังอัปเดตข้อมูล...</div>';
      try {
        const res = await fetch(API_URL, { redirect: 'follow' });
        const data = await res.json();
        document.getElementById('totalBalance').textContent = formatMoney(data.balance);
        
        if (!data.records || data.records.length === 0) {
          listEl.innerHTML = '<div class="empty-state">ยังไม่มีรายการบันทึก เริ่มจดรายการแรกได้เลย!</div>';
          return;
        }

        listEl.innerHTML = data.records.map(r => {
          const isInc = r.type === 'รายรับ';
          return `
            <div class="tx-item">
              <div class="tx-left">
                <div class="tx-icon ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}</div>
                <div class="tx-info">
                  <span class="tx-name">${r.item || 'ไม่ระบุรายการ'}</span>
                  <span class="tx-date">${r.date}</span>
                </div>
              </div>
              <div class="tx-right">
                <div class="tx-amount ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}${formatMoney(r.amount)}</div>
                <div class="tx-bal">คงเหลือ ${formatMoney(r.balance)}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<div class="empty-state" style="color:#e11d48;">โหลดข้อมูลไม่สำเร็จ กรุณากดรีเฟรชอีกครั้ง</div>';
      }
    }

    document.getElementById('txForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      const payload = {
        date: document.getElementById('dateInput').value,
        type: currentType,
        item: document.getElementById('itemInput').value.trim(),
        amount: parseFloat(document.getElementById('amountInput').value)
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        document.getElementById('itemInput').value = '';
        document.getElementById('amountInput').value = '';
        setTimeout(loadData, 1500);
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึก');
      } finally {
        btn.disabled = false;
        btn.textContent = 'บันทึกรายการ';
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    loadData();
  </script>
</body>
</html>
